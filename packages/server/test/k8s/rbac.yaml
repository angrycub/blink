# RBAC resources for the Blink server ServiceAccount.
# The server needs permission to create/read/delete Pods,
# Services, and ConfigMaps in its namespace to manage agent
# deployments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blink-server
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: blink-agent-deployer
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: blink-server-deployer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: blink-server
    namespace: default
roleRef:
  kind: Role
  name: blink-agent-deployer
  apiGroup: rbac.authorization.k8s.io
